services:
  # Go server. Production on the Pi runs the binary directly under systemd
  # (see scripts/deploy-pi.sh); this compose file is for local / container use.
  kick-proxy:
    build:
      context: .
    # network_mode: "host" is Linux-only but is required for Chromecast mDNS
    # discovery to work. With the port mapping below (for macOS), discovery is
    # limited to the fallback subnet scan. On Linux/Pi, prefer host networking.
    # network_mode: "host"
    ports:
      - "8081:8081"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PORT: "8081"
      LOG_LEVEL: "INFO"
      DEFAULT_LANGUAGE_CODE: "en"
      KICK_API_BASE_URL: "https://kick.com/api/v2/channels/"
      KICK_FEATURED_LIVESTREAMS_URL: "https://kick.com/stream/featured-livestreams/"
      CACHE_DEFAULT_TIMEOUT: "300"
      LIVE_CACHE_DURATION_SECONDS: "30"
      VOD_CACHE_DURATION_SECONDS: "300"
      SECURITY_HEADERS_ENABLED: "True"
      CHROMECAST_SCAN_TIMEOUT: "5"
      CHROMECAST_SELECT_MAX_RETRIES: "2"
      CHROMECAST_SELECT_RETRY_DELAY: "2"
      CHROMECAST_DEVICE_CACHE_SECONDS: "30"
    healthcheck:
      test: ["CMD", "/kick-api", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M
